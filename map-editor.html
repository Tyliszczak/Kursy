<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#d71920">
  <title>Ustaw lokalizację przystanku</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f6f8;color:#17202a}body{display:flex;flex-direction:column}.top{padding:12px;background:#fff;border-bottom:1px solid #e4e7ec;box-shadow:0 2px 8px #10182818;z-index:5}.title{font-weight:900;font-size:18px}.meta{font-size:13px;color:#667085;margin-top:4px}.coords{margin-top:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#d71920;font-weight:800}.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.controls button{font:inherit;border-radius:10px;border:1px solid #e4e7ec;padding:11px 14px;background:#fff;font-weight:800}.controls .save{background:#d71920;color:#fff;border-color:#d71920}.msg{margin-top:7px;min-height:18px;font-size:14px;color:#667085}.map{flex:1;min-height:360px}.leaflet-control-attribution{font-size:9px}</style>
</head>
<body><div class="top"><div class="title">Ustaw lokalizację przystanku</div><div class="meta" id="meta"></div><div class="coords" id="coords"></div><div class="controls"><button id="save" class="save">Zapisz lokalizację</button><button id="myLocation">Moja lokalizacja</button><button id="cancel">Anuluj</button></div><div class="msg" id="msg">Przeciągnij pinezkę albo dotknij wybrane miejsce na mapie.</div></div><div id="map" class="map"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const RESULT_KEY='kursy.map.result.v1',q=new URLSearchParams(location.search),key=q.get('key')||'',field=q.get('field')==='locationReturn'?'locationReturn':'locationOut',name=q.get('name')||'Przystanek',raw=q.get('coords')||'',match=raw.match(/(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)/);let lat=match?+match[1]:51.9356,lng=match?+match[2]:15.5062;document.getElementById('meta').textContent=`${name} • ${field==='locationReturn'?'POWRÓT':'TAM'}`;const coords=document.getElementById('coords'),msg=document.getElementById('msg'),map=L.map('map',{zoomControl:true}).setView([lat,lng],match?18:14);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const marker=L.marker([lat,lng],{draggable:true}).addTo(map);function setPoint(a,b,pan=false){lat=a;lng=b;marker.setLatLng([lat,lng]);if(pan)map.setView([lat,lng],18);coords.textContent=`${lat.toFixed(6)}, ${lng.toFixed(6)}`}setPoint(lat,lng);marker.on('dragend',()=>{const p=marker.getLatLng();setPoint(p.lat,p.lng)});map.on('click',e=>setPoint(e.latlng.lat,e.latlng.lng));document.getElementById('myLocation').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{setPoint(p.coords.latitude,p.coords.longitude,true);msg.textContent='Ustawiono bieżącą lokalizację.'},()=>msg.textContent='Nie udało się pobrać lokalizacji telefonu.',{enableHighAccuracy:true,timeout:10000});document.getElementById('save').onclick=()=>{if(!key){msg.textContent='Brakuje identyfikatora przystanku.';return}localStorage.setItem(RESULT_KEY,JSON.stringify({key,field,coordinates:`${lat.toFixed(6)}, ${lng.toFixed(6)}`,ts:Date.now()}));msg.textContent='Zapisano. Wracam do edycji trasy…';setTimeout(()=>{try{window.close()}catch{};if(!window.closed)history.back()},180)};document.getElementById('cancel').onclick=()=>{try{window.close()}catch{};if(!window.closed)history.back()};
</script></body></html>
